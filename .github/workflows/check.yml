name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # Lint and tests on all three desktop platforms (R04); the build runs once, on Linux.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, xmlwriter, zip
          tools: composer

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint JavaScript and Vue
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        if: matrix.os == 'ubuntu-latest'
        run: npm run build

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP
        run: npm run lint:php

      - name: PHP tests
        run: npm run test:php
