name: check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  # A push and its PR check share a branch; keep only the newest run for it.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    # Lint and tests on all three desktop platforms (R04); the build runs once, on Linux.
    strategy:
      fail-fast: false
      matrix:
        # Self-hosted runners (the pipeline repo's R29). macOS is left out until the
        # Mac mini runner exists: GitHub-hosted runners are stopped for private repos.
        include:
          - os: linux
            runner: [self-hosted, linux]
          - os: windows
            runner: [self-hosted, windows]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: shivammathur/setup-php@v2
        if: runner.os != 'Windows' || runner.environment == 'github-hosted'
        with:
          php-version: '8.4'
          extensions: dom, xmlwriter, zip
          tools: composer

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint JavaScript and Vue
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        if: matrix.os == 'linux'
        run: npm run build

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP
        run: npm run lint:php

      - name: PHP tests
        run: npm run test:php
