name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint JavaScript and Vue
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP
        run: npm run lint:php

      - name: PHP tests
        run: npm run test:php
