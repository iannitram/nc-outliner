name: check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  # Branches run once, through their PR; a newer run of the same PR or branch cancels the older one.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Lint and tests on all three desktop platforms (R04); the build runs once, on Linux.
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted runners only: this repo is public.
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: shivammathur/setup-php@v2
        if: runner.os != 'Windows' || runner.environment == 'github-hosted'
        with:
          php-version: '8.4'
          extensions: dom, xmlwriter, zip
          tools: composer

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Lint JavaScript and Vue
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        if: matrix.os == 'linux'
        run: npm run build

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP
        run: npm run lint:php

      - name: PHP tests
        run: npm run test:php
